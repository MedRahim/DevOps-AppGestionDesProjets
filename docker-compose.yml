services:
  mysql:
    image: mysql:8.0
    container_name: gp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKER_USER:-local}/gp-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: gp-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8089:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - gp-network

  frontend:
    image: ${DOCKER_USER:-local}/gp-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    container_name: gp-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - gp-network

volumes:
  mysql_data:

networks:
  gp-network:
    driver: bridge
